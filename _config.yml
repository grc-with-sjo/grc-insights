title: GRC Insights
description: >-
  Digital trust, decoded. A GRC practitioner's field notes on AI governance, privacy and cybersecurity:
  what is changing, what it means for tech, SaaS, cloud, hardware, banking and retail, and how governance should adapt.
url: https://grc-with-sjo.github.io
baseurl: /grc-insights
lang: en
timezone: America/Vancouver
author:
  name: Surabhi Joshi
  role: GRC & AI Governance Practitioner
  location: Vancouver, BC
  url: https://www.linkedin.com/in/surabhijo/
social:
  name: Surabhi Joshi
  links:
    - https://www.linkedin.com/in/surabhijo/
# Fill in during setup (README.md). Empty means the feature is hidden.
goatcounter: ""
linkedin_newsletter: ""

markdown: kramdown
future: false  # issues dated in the future stay hidden until a rebuild on/after their date (see .github/workflows/scheduled-publish.yml)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  issues:
    output: true
    permalink: /issues/:name/

defaults:
  - scope: { path: "" }
    values: { image: /assets/og-card.png }
  - scope: { path: "", type: issues }
    values: { layout: issue }

exclude:
  - package.json
  - package-lock.json
  - node_modules
  - scripts
  - tests
  - routine
  - social
  - docs
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
