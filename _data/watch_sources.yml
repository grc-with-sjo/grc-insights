# Radar watch: feeds checked daily by .github/workflows/radar-watch.yml (scripts/radar-watch.mjs).
# A hit is only a lead. Every Radar change is verified on the primary site in `verify_at`
# (read in a browser where the site blocks scripts) before the tracker or change log is edited.
# Google News "site:" searches stand in for regulators whose own sites block automated readers.

keywords:
  - privacy
  - personal data
  - personal information
  - data protection
  - artificial intelligence
  - AI
  - machine learning
  - automated decision
  - algorithm
  - cyber
  - security
  - incident report
  - breach
  - ransomware
  - SOC 2
  - Trust Services
  - attestation
  - ISO/IEC
  - "27001"
  - "27701"
  - "27090"
  - "42001"
  - NIST
  - framework
  - guideline
  - guidance
  - regulation
  - consultation
  - exposure draft
  - draft
  - code of practice
  - enforcement
  - penalty
  - fine
  - settlement
  - children
  - consumer data
  - surveillance pricing
  - personalized pricing
  - model risk
  - third-party
  - operational resilience
  - DORA
  - NIS2
  - Cyber Resilience Act
  - GDPR
  - CCPA
  - PIPEDA
  - DPDP
  - FedRAMP
  - CMMC
  - PCI DSS

sources:
  # Standards and assurance
  - id: aicpa-soc
    name: AICPA (SOC 2, attestation standards)
    kind: rss
    url: "https://news.google.com/rss/search?q=site:aicpa-cima.com+(SOC+OR+%22trust+services%22+OR+attestation+OR+%22exposure+draft%22)+when:14d&hl=en-US&gl=US&ceid=US:en"
    verify_at: "https://www.aicpa-cima.com/news"
  - id: iso-iec
    name: ISO/IEC (security, privacy and AI standards)
    kind: rss
    url: "https://news.google.com/rss/search?q=site:iso.org+%22ISO/IEC%22+(AI+OR+security+OR+privacy+OR+cybersecurity)+when:14d&hl=en-US&gl=US&ceid=US:en"
    verify_at: "https://www.iso.org/standards.html"
  # Standards pages are indexed once, often weeks before anyone writes about them, so these look back 120 days.
  - id: iso-2026-editions
    name: ISO/IEC standards published in 2026
    kind: rss
    days: 120
    url: "https://news.google.com/rss/search?q=site:iso.org+%22ISO/IEC%22+2026&hl=en-US&gl=US&ceid=US:en"
    verify_at: "https://www.iso.org/standards.html"
  - id: iso-cyber
    name: ISO/IEC cybersecurity and privacy standards
    kind: rss
    days: 120
    url: "https://news.google.com/rss/search?q=site:iso.org+%22ISO/IEC%22+cybersecurity&hl=en-US&gl=US&ceid=US:en"
    verify_at: "https://www.iso.org/committee/45306.html"
  - id: iso-ai
    name: ISO/IEC AI standards
    kind: rss
    days: 120
    url: "https://news.google.com/rss/search?q=site:iso.org+%22ISO/IEC%22+%22artificial+intelligence%22&hl=en-US&gl=US&ceid=US:en"
    verify_at: "https://www.iso.org/committee/6794475.html"
  - id: nist-news
    name: NIST news
    kind: rss
    url: "https://www.nist.gov/news-events/news/rss.xml"
    verify_at: "https://www.nist.gov"
  - id: fedreg-nist
    name: Federal Register (NIST)
    kind: fedreg
    url: "https://www.federalregister.gov/api/v1/documents.json?per_page=20&order=newest&conditions[agencies][]=national-institute-of-standards-and-technology"
    verify_at: "https://www.federalregister.gov"
  - id: pci-ssc
    name: PCI Security Standards Council blog
    kind: rss
    url: "https://blog.pcisecuritystandards.org/rss.xml"
    verify_at: "https://www.pcisecuritystandards.org"
  - id: csa
    name: Cloud Security Alliance blog
    kind: rss
    url: "https://cloudsecurityalliance.org/blog/feed"
    verify_at: "https://cloudsecurityalliance.org"

