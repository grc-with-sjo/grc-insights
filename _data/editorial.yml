# Controls what the weekly routine does. See scripts/plan-run.mjs for the exact rules.
# cadence: monthly → calendar entries publish; otherwise first Sunday of each month from monthly_start.
# cadence: weekly  → an issue every Sunday (calendar themes still apply on their dates).
cadence: monthly
calendar:
  2026-10-11: { series: catch-up, theme: "Canada privacy & AI: federal reform, Law 25, BC PIPA" }
  2026-10-18: { series: catch-up, theme: "EU AI Act phase-ins, GDPR enforcement, UK" }
  2026-10-25: { series: catch-up, theme: "US state privacy & AI laws + FTC (incl. retail & consumer data)" }
  2026-11-01: { series: catch-up, theme: "Banking/FinServ: OSFI E-23, DORA, model risk, AI in credit" }
  2026-11-08: { series: catch-up, theme: "Tech, SaaS, cloud, hardware: AI supply chain, chips, vendor AI clauses" }
  2026-11-15: { series: catch-up, theme: "APAC, India DPDP, global standards + 2027 outlook" }
  2026-11-22: { series: catch-up, theme: "Security & cyber: FedRAMP 20x, ISO 27001/42001 certification, CMMC, cyber incident-reporting rules" }
  2026-11-29: { series: feature, theme: "AIUC-1 explained: what the AI agent standard (and insuring AI risk) means for AI builders, buyers, insurers, boards and regulators" }
monthly_start: "2026-12-06"
monthly_feature_rotation: [banking, saas, cloud, tech, retail, hardware]
sources:
  regulators: [OPC, BC OIPC, CAI Québec, IPC Ontario, Alberta OIPC, OSFI, FTC, CPPA, State AGs, EDPB, EU AI Office, ICO, PDPC Singapore, OAIC, MeitY / Data Protection Board of India]
  standards: [NIST, ISO/IEC JTC 1/SC 42, OECD.AI]
  trackers: [IAPP]
  security: [Canadian Centre for Cyber Security, CISA, FedRAMP PMO, NIST CSRC, ENISA, NCSC UK, ISO/IEC JTC 1/SC 27, PCI SSC, Cloud Security Alliance, AICPA (SOC 2)]
